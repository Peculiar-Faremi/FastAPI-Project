name: Build and Deploy
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: "ubuntu-latest"
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 2
      ALGORITHM: HS256
      REDIS_URL: redis://localhost:6379/0
      TEST_REDIS_URL: redis://localhost:6379/1
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13.15"  
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: |
          pytest
    services:
      redis:
        image: redis  # starts a Redis container for the tests
        ports:
          - 6379:6379  # same door as on your laptop
        # before the steps start, so tests don't run against a Redis that isn't ready
        options: >-  #makes GitHub wait until Redis answers a ping
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
  build:
    needs: test #only start if "test" passed
    #DISABLED: build paused to save Docker Hub storage.
    # To re-enable, replace "if: false" with:
    # if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    if: false
    runs-on: ubuntu-latest  
    steps:
      - uses: actions/checkout@v5 
      - name: Login to Docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Buildx #set up builder needed for caching below
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/fastapi-project:latest 
            ${{ secrets.DOCKER_USERNAME }}/fastapi-project:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha, mode=max
      - name: Image Digest
        run: |
          echo ${{steps.docker_build.outputs.digest}}
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
           